name: email-extractor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: extractor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d extractor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - htmldata:/data/html
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      # 50 domains in flight, but each holds a connection only for short transactions.
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "20"
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 30s
    volumes:
      - htmldata:/data/html
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Public entry for the portal (clients.leadgenjay.com), which runs on Railway and
  # cannot reach thor's Tailscale address. Cloudflare Access (service token) sits in
  # front, the X-API-Key behind it. Off until TUNNEL_TOKEN is set:
  #   docker compose --profile tunnel up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  htmldata:
